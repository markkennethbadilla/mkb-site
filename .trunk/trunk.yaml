# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - gitleaks@8.30.1
    - osv-scanner@2.7.1
  ignore:
    - linters: [ALL]
      paths:
        - node_modules/**
        - out/**
        - .next/**
        - .wrangler/**
        - .lighthouseci/**
        - .trunk/**
# Local gate (SPEC.md "Checks"). GitHub Actions were removed on 2026-10-23.
# Stock Trunk hook actions only warn, so these run trunk check --ci (never
# prompts) and the repo's own gate script, which runs every check the old
# workflows ran.
actions:
  definitions:
    # Opengrep security scan (house skill gate-commits-with-trunk, mkb-winops spec 060
    # installs the binary and the pinned js/ts security rules). Only files changed
    # since origin/main, only new findings; blocks on ERROR and WARNING. Override one
    # finding with `// nosemgrep: <rule-id>` (the short id it prints) on or above the line.
    - id: block-push-on-opengrep
      triggers: [{git_hooks: [pre-push]}]
      environment:
        - name: MISE_GLOBAL_CONFIG_FILE
          value: ${env.MISE_GLOBAL_CONFIG_FILE}
        - name: PATHEXT
          value: ${env.PATHEXT}
      run: sh -c 't=$(command -v timeout) && t="$t 60"; o="scan --experimental --disable-version-check --error --severity ERROR --severity WARNING --baseline-commit origin/main --config C:/ProgramData/opengrep/semgrep-rules ."; for n in 1 2; do $t opengrep $o; rc=$?; case $rc in 0|1) exit $rc;; 2|124) ;; *) echo "opengrep setup error (exit $rc): push blocked" >&2; exit $rc;; esac; echo "opengrep crashed (exit $rc, not a finding), try $n of 2" >&2; done; echo "opengrep crashed twice (exit $rc): push not blocked, run it by hand" >&2'
    - id: block-commit-on-findings
      triggers: [{git_hooks: [pre-commit]}]
      run: trunk check --ci --exclude=osv-scanner
    - id: block-push-on-findings
      triggers: [{git_hooks: [pre-push]}]
      run: trunk check --ci --exclude=osv-scanner --upstream origin/main
    - id: block-push-on-osv
      triggers: [{git_hooks: [pre-push]}]
      run: trunk check --ci --no-fix --all --filter osv-scanner
    # A separate action: Trunk runs `run` without a shell, so `&&` in one line
    # reached trunk check as file arguments and failed the push for that reason.
    - id: repo-checks-on-push
      triggers: [{git_hooks: [pre-push]}]
      # Trunk passes no environment by default: turbo needs bun on PATH, Playwright its browsers, the evals the vault.
      environment:
        - name: PATH
          value: ${env.PATH}
        - name: PATHEXT
          value: ${env.PATHEXT}
        - name: MISE_GLOBAL_CONFIG_FILE
          value: ${env.MISE_GLOBAL_CONFIG_FILE}
        - name: LOCALAPPDATA
          value: ${env.LOCALAPPDATA}
        - name: APPDATA
          value: ${env.APPDATA}
        - name: USERPROFILE
          value: ${env.USERPROFILE}
        - name: TEMP
          value: ${env.TEMP}
      run: bun run --silent gate
    - id: maintainability-on-push
      triggers: [{git_hooks: [pre-push]}]
      run: bun run --silent maint
  enabled: [block-commit-on-findings, block-push-on-findings, repo-checks-on-push, block-push-on-opengrep, block-push-on-osv, maintainability-on-push]
