# Rule 43 self-check (SPEC.md "Records first"): every POST to /api/* is stored
# before any handler can refuse it. About 2 minutes a run; <= 60 minutes a month.
name: Records first
on:
  push:
    branches: [main]
    paths: ['worker/**', 'migrations/**', 'wrangler.jsonc', 'vitest.config.mts', 'package.json', 'bun.lock', '.github/workflows/records-first.yml']
  pull_request:
    paths: ['worker/**', 'migrations/**', 'wrangler.jsonc', 'vitest.config.mts', 'package.json', 'bun.lock', '.github/workflows/records-first.yml']
concurrency:
  group: records-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:worker worker/records-first.test.ts
