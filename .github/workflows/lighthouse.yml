# Lighthouse CI gate (agentops rule 73): build the static export and audit
# / and /resume/, mobile and desktop. Floors live in lighthouserc*.json.
name: Lighthouse
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Lighthouse mobile
        run: npx -y @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - name: Lighthouse desktop
        if: always()
        run: npx -y @lhci/cli@0.15.1 autorun --config=lighthouserc.desktop.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
